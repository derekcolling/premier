<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Premier — Now card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A3BD8}a:hover{color:#1C2799}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 560px; height: 960px; box-sizing: border-box; background: #E4E8ED; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B1F2A">
  <div style="width: 390px; height: 820px; background: #FFFFFF; border-radius: 52px; box-shadow: 0 40px 80px rgba(31, 45, 61, 0.14), 0 6px 16px rgba(31, 45, 61, 0.06); overflow: hidden; display: flex; flex-direction: column">

    <section style="height: 640px; flex-shrink: 0; box-sizing: border-box; background: {{accent}}; color: #FFFFFF; border-radius: 52px 52px 0 210px / 52px 52px 0 96px; padding: 40px 34px 30px 36px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.28em">PREMIER</span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #FFFFFF"></span>
      </div>

      <svg width="42" height="34" viewBox="0 0 42 34" aria-hidden="true" style="margin-top: 70px">
        <path d="M0 34V19.5C0 8.6 5.6 2.1 16.4 0l2 4.4C12.6 6 9.7 9.4 9.3 14.6H17V34H0Zm24.6 0V19.5C24.6 8.6 30.2 2.1 41 0l2 4.4c-5.8 1.6-8.7 5-9.1 10.2h7.7V34H24.6Z" fill="#FFFFFF"></path>
      </svg>

      <h1 style="margin: 24px 0 0; font-size: 31px; line-height: 1.16; font-weight: 800; letter-spacing: -0.01em; max-width: 270px">Your design crit starts in twelve minutes.</h1>

      <div aria-hidden="true" style="display: flex; gap: 5px; margin-top: 18px">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #FFFFFF"></span>
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #FFFFFF"></span>
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #FFFFFF"></span>
      </div>

      <div style="display: flex; align-items: center; margin-top: 34px">
        <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.35); display: flex">
          <div style="width: 80%; height: 1px; background: #FFFFFF"></div>
        </div>
        <div aria-label="Day 80% complete" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.85); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">80%</div>
      </div>

      <p style="margin: 26px 0 0; font-size: 11px; font-weight: 800; letter-spacing: 0.2em">THURSDAY 08 <span style="color: rgba(255, 255, 255, 0.78); font-weight: 600">· 2026</span></p>

      <div style="display: flex; gap: 2px; margin: 14px 0 0 -14px">
        <button aria-label="Share" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border-radius: 12px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
        </button>
        <button aria-label="Save" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border-radius: 12px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </button>
        <button aria-label="Copy link" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border-radius: 12px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>
        </button>
      </div>

      <div style="margin-top: auto; align-self: flex-end; text-align: right">
        <p style="margin: 0; font-size: 13px; font-weight: 700">Design crit</p>
        <p style="margin: 3px 0 0; font-size: 11px; font-weight: 500">Studio B · 10:00</p>
      </div>
    </section>

    <nav aria-label="Controls" style="flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 24px 6px 26px">
      <div style="width: 94px; height: 54px; border-radius: 18px; background: #EEF0F4; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.01em">12:00</div>
      <button aria-label="Calendar" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1B1F2A; display: flex; align-items: center; justify-content: center; border-radius: 12px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
      </button>
      <button aria-label="Messages" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1B1F2A; display: flex; align-items: center; justify-content: center; border-radius: 12px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <button aria-label="Notifications" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1B1F2A; display: flex; align-items: center; justify-content: center; border-radius: 12px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
      </button>
      <button aria-label="Start focus timer" style="width: 52px; height: 52px; border: 0; border-radius: 50%; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(42, 59, 216, 0.28)">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor"></path></svg>
      </button>
    </nav>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2A3BD8","options":["#2A3BD8","#C2410C","#0F766E","#6D28D9"]},"$preview":{"width":560,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2A3BD8' };
  }
}
</script>
</body>
</html>
