<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Premier — Home, soft</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3E5C4E}a:hover{color:#26392F}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 560px; height: 960px; box-sizing: border-box; background: #8FA89A; display: flex; align-items: center; justify-content: center; font-family: 'Poppins', system-ui, sans-serif; color: #2A2620">
  <div style="width: 390px; height: 820px; background: #FBF9F4; border-radius: 48px; box-shadow: 0 36px 70px rgba(32, 48, 40, 0.28); overflow: hidden; display: flex; flex-direction: column">

    <header style="padding: 54px 30px 0">
      <p style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 500">Good afternoon,<br><strong style="font-weight: 700">Derek!</strong></p>
    </header>

    <section aria-label="Next up" style="margin: 26px 18px 0; height: 300px; box-sizing: border-box; border-radius: 30px; background: {{cardColor}}; padding: 26px 24px; display: flex; flex-direction: column; overflow: hidden; position: relative">
      <div aria-hidden="true" style="position: absolute; top: 34px; right: 46px; width: 92px; height: 92px; border-radius: 50%; background: #F08A3E"></div>
      <p style="margin: 0; font-size: 22px; font-weight: 600; position: relative">Tuesday, <span style="color: #8A4A12">Sep 15</span></p>
      <p style="margin: auto 0 0; font-size: 19px; line-height: 1.35; font-weight: 600; max-width: 260px; position: relative">Ada has Musical Theater at 4:15 today</p>
      <p style="margin: 8px 0 0; font-size: 12px; font-weight: 500; color: #5A4A2C">Studio 2 · with Katelyn</p>
    </section>

    <section aria-label="Today's schedule" style="margin: 14px 18px 0; flex: 1; min-height: 0; box-sizing: border-box; border-radius: 30px 30px 0 0; background: #DCE7DF; padding: 20px 22px 0; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Your schedule</h2>
        <a href="#" style="min-height: 44px; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none">Full day <span aria-hidden="true">›</span></a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 12px; background: #FBF9F4; border-radius: 16px; padding: 10px 14px">
          <span style="width: 46px; font-size: 13px; font-weight: 700">5:00</span>
          <span style="display: flex; flex-direction: column"><strong style="font-size: 13px; font-weight: 600">Opal Ballet</strong><span style="font-size: 11px; color: #5C6660">Studio 5 · Emily</span></span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; background: #FBF9F4; border-radius: 16px; padding: 10px 14px">
          <span style="width: 46px; font-size: 13px; font-weight: 700">6:30</span>
          <span style="display: flex; flex-direction: column"><strong style="font-size: 13px; font-weight: 600">Opal Acro</strong><span style="font-size: 11px; color: #5C6660">Studio 3 · Jessie &amp; Jillian</span></span>
        </div>
      </div>
    </section>

    <nav aria-label="Main" style="height: 84px; flex-shrink: 0; background: #FBF9F4; border-top: 1px solid #E8E4DA; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 10px 8px">
      <a href="#" aria-current="page" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #2A2620; font-size: 10px; font-weight: 600; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"></path></svg>
        Home
      </a>
      <a href="#" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6E6A62; font-size: 10px; font-weight: 500; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
        Schedule
      </a>
      <a href="#" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6E6A62; font-size: 10px; font-weight: 500; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4"></path><path d="M16 6h3a3 3 0 0 1-3 4"></path><path d="M12 13v4"></path><path d="M8.5 20.5h7"></path></svg>
        Events
      </a>
      <a href="#" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6E6A62; font-size: 10px; font-weight: 500; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"></circle><circle cx="12" cy="12" r="1.8" fill="currentColor"></circle><circle cx="19" cy="12" r="1.8" fill="currentColor"></circle></svg>
        More
      </a>
    </nav>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cardColor":{"editor":"color","default":"#F6CF5E","options":["#F6CF5E","#F3B9A0","#BFD3F5"]},"$preview":{"width":560,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { cardColor: this.props.cardColor ?? '#F6CF5E' };
  }
}
</script>
</body>
</html>
